AWSTemplateFormatVersion: "2010-09-09"
Description: Simple LLM proxy - Lambda Function URL in front of Amazon Bedrock (Anthropic Messages API compatible)

Parameters:
  KeysParameterName:
    Type: String
    Default: /llm-proxy/keys
    Description: SSM SecureString parameter that holds the API key configuration (JSON)
  LogRetentionDays:
    Type: Number
    Default: 30
  AllowedBetas:
    Type: String
    Default: ""
    Description: Comma-separated anthropic-beta values to pass through to Bedrock (others are dropped)

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: llm-proxy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KeysParameterName}

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt Role.Arn
      Code: ./src
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          KEYS_PARAM: !Ref KeysParameterName
          ALLOWED_BETAS: !Ref AllowedBetas

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  # 匿名呼び出しには 2 つの許可が必要。InvokeFunctionUrl だけだと Function URL が 403 を返す。
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  LogGroupName:
    Value: !Ref LogGroup
